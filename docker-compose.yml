services:
  formpilot:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY to a random value of at least 32 characters}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      FORMPILOT_DATA_DIR: /app/backend/data
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      MAX_FILE_MB: ${MAX_FILE_MB:-20}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-30}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      PDF_UNICODE_FONT: ${PDF_UNICODE_FONT:-}
      PDF_UNICODE_FONT_BOLD: ${PDF_UNICODE_FONT_BOLD:-}
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
